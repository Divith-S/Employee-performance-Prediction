[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "employee-performance-prediction"
version = "1.0.0"
description = "An educational machine-learning pipeline for employee performance categories"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Divith S" }]
dependencies = [
  "joblib>=1.3,<2.0",
  "matplotlib>=3.8,<4.0",
  "pandas>=2.1,<3.0",
  "scikit-learn>=1.4,<2.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
